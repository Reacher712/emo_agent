<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可灵AI视频生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .upload-section {
            border: 3px dashed #e5e7eb;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            border-color: #4f46e5;
            background: #f8fafc;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #4f46e5;
        }
        
        .preview-container {
            margin-top: 20px;
            display: none;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .input-section textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }
        
        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        select, input {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        }
        
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result-section {
            grid-column: 1 / -1;
            margin-top: 20px;
        }
        
        .progress-container {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .video-result {
            display: none;
            text-align: center;
        }
        
        .video-player {
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }
        
        .status-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .status-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .status-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
    </style>
</head>

    <div class="container">

    <script>
       
        // 后端API地址（如果后端运行在本地）
        const API_BASE_URL = 'http://localhost:5000';
        // ==================== 监控功能配置 ====================


// 监控相关变量
let autoRefresh = true;
let autoRefreshInterval = null;
let currentTask = null;
let taskHistory = JSON.parse(localStorage.getItem('kling_task_history') || '[]');
let pollingInterval = null;  // 轮询任务状态的定时器

// ==================== 监控初始化 ====================
function initMonitor() {
    console.log('[MONITOR] 初始化监控系统');
    loadTaskHistory();
    
    // 恢复当前任务
    const savedTask = localStorage.getItem('kling_current_task');
    if (savedTask) {
        try {
            currentTask = JSON.parse(savedTask);
            updateCurrentTaskDisplay();
            if (currentTask.status === 'processing' || currentTask.status === 'submitted') {
                startPollingTaskStatus(currentTask.task_id);
            }
        } catch (e) {
            console.error('[MONITOR] 恢复任务失败:', e);
        }
    }
}

// ==================== 任务状态轮询 ====================
function startPollingTaskStatus(taskId) {
    console.log('[MONITOR] 开始轮询任务状态:', taskId);
    
    if (!taskId || taskId === 'null') {
        console.error('[MONITOR] 无效的任务ID');
        return;
    }
    
    // 清除现有的轮询
    if (pollingInterval) {
        clearInterval(pollingInterval);
    }
    
    let attempts = 0;
    const maxAttempts = 120; // 最多10分钟（120 * 5秒）
    
    pollingInterval = setInterval(async () => {
        attempts++;
        console.log(`[MONITOR] 查询任务状态 (${attempts}/${maxAttempts}):`, taskId);
        
        try {
            const response = await fetch(`${API_BASE_URL}/api/task-status/${taskId}`);
            
            if (!response.ok) {
                console.error('[MONITOR] 查询失败:', response.status);
                if (attempts >= maxAttempts) {
                    clearInterval(pollingInterval);
                    updateTaskStatusInUI('failed', '查询超时');
                }
                return;
            }
            
            const result = await response.json();
            console.log('[MONITOR] 查询结果:', result);
            
            if (result.code === 0) {
                const taskStatus = result.data.task_status;
                console.log('[MONITOR] 任务状态:', taskStatus);
                
                // 更新UI显示
                updateTaskStatusInUI(taskStatus, result.data.task_status_msg);
                
                // 更新历史记录
                updateTaskInHistory(taskId, result.data);
                
                if (taskStatus === 'succeed' || taskStatus === 'failed') {
                    clearInterval(pollingInterval);
                    
                    // 如果成功，显示视频
                    if (taskStatus === 'succeed' && result.data.task_result?.videos?.length > 0) {
                        showSuccessVideo(result.data.task_result.videos[0]);
                    }
                }
            }
            
        } catch (error) {
            console.error('[MONITOR] 轮询失败:', error);
            if (attempts >= maxAttempts) {
                clearInterval(pollingInterval);
                updateTaskStatusInUI('failed', '网络错误');
            }
        }
    }, 5000); // 每5秒查询一次
}

// ==================== UI更新函数 ====================
function updateTaskStatusInUI(status, message = '') {
    // 更新状态指示器
    const statusIndicator = document.querySelector('.status-indicator');
    const statusText = document.querySelector('.status-text');
    
    if (statusIndicator && statusText) {
        statusIndicator.className = 'status-indicator ' + status;
        statusText.textContent = getStatusText(status);
        
        // 如果有消息，显示在进度文本中
        const progressText = document.getElementById('progressText');
        if (progressText && message) {
            progressText.textContent = getStatusText(status) + ': ' + message;
        }
    }
    
    // 更新进度条
    updateMonitorProgress(status);
}

function updateMonitorProgress(status) {
    const progressMap = {
        'submitted': 30,
        'processing': 60,
        'succeed': 100,
        'failed': 100
    };
    
    const progress = progressMap[status] || 0;
    const progressBar = document.getElementById('progressFill');
    if (progressBar) {
        progressBar.style.width = `${progress}%`;
    }
}

function showSuccessVideo(videoData) {
    console.log('[MONITOR] 显示成功视频:', videoData);
    
    // 显示视频播放器
    const videoResult = document.getElementById('videoResult');
    const videoPlayer = document.getElementById('videoPlayer');
    const downloadLink = document.getElementById('downloadLink');

// ==================== 任务历史管理 ====================
function addTaskToHistory(task) {
    const historyItem = {
        id: task.task_id,
        prompt: task.prompt,
        status: task.status,
        created_at: task.created_at || Date.now(),
        updated_at: task.updated_at || Date.now(),
        duration: task.task_result?.videos?.[0]?.duration || null,
        has_video: !!(task.task_result?.videos?.[0]?.url)
    };
    
    // 添加到历史记录开头
    taskHistory.unshift(historyItem);
    
    // 限制历史记录数量
    if (taskHistory.length > 50) {
        taskHistory = taskHistory.slice(0, 50);
    }
    
    // 保存到localStorage
    localStorage.setItem('kling_task_history', JSON.stringify(taskHistory));
    
    // 更新UI
    loadTaskHistory();
}

function updateTaskInHistory(taskId, taskData) {
    const index = taskHistory.findIndex(item => item.id === taskId);
    if (index !== -1) {
        taskHistory[index].status = taskData.task_status;
        taskHistory[index].updated_at = taskData.updated_at;
        taskHistory[index].duration = taskData.task_result?.videos?.[0]?.duration || null;
        taskHistory[index].has_video = !!(taskData.task_result?.videos?.[0]?.url);
        
        localStorage.setItem('kling_task_history', JSON.stringify(taskHistory));
        loadTaskHistory();
    }
}

function loadTaskHistory() {
    const historyContainer = document.getElementById('taskHistoryList');
    if (!historyContainer) return;
    
    if (taskHistory.length === 0) {
        historyContainer.innerHTML = '<p class="empty-history">暂无历史记录</p>';
        return;
    }
    
    let html = '';
    taskHistory.forEach((task, index) => {
        html += `
            <div class="task-history-item" onclick="viewTaskDetails('${task.id}')">
                <div class="task-history-header">
                    <span class="task-id">${task.id.substring(0, 12)}...</span>
                    <span class="task-status ${task.status}">${getStatusText(task.status)}</span>
                </div>
                <div class="task-history-body">
                    <p class="task-prompt">${task.prompt ? task.prompt.substring(0, 30) + (task.prompt.length > 30 ? '...' : '') : '无描述'}</p>
                    <div class="task-history-footer">
                        <span class="task-time">${formatTime(task.created_at)}</span>
                        ${task.has_video ? '<span class="task-has-video">📹</span>' : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    historyContainer.innerHTML = html;
}

// ==================== 辅助函数 ====================
function getStatusText(status) {
    const statusMap = {
        'submitted': '已提交',
        'processing': '处理中',
        'succeed': '成功',
        'failed': '失败'
    };
    return statusMap[status] || status;
}

function formatTime(timestamp) {
    if (!timestamp) return '-';
    const date = new Date(parseInt(timestamp));
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function showMessage(text, type = 'info') {
    const messageDiv = document.getElementById('statusMessage');
    if (!messageDiv) return;
    
    messageDiv.textContent = text;
    messageDiv.className = `status-message status-${type}`;
    messageDiv.style.display = 'block';
    
    if (type === 'error') {
        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    }
}

// ==================== 监控面板操作 ====================
function toggleMonitor() {
    const sidebar = document.getElementById('monitorSidebar');
    const btn = document.getElementById('monitorBtn');
    
    if (sidebar.classList.contains('active')) {
        sidebar.classList.remove('active');
        btn.textContent = '📊 监控面板';
    } else {
        sidebar.classList.add('active');
        btn.textContent = '📊 隐藏监控';
        loadTaskHistory();
    }
}

async function viewTaskDetails(taskId) {
    try {
        const response = await fetch(`${API_BASE_URL}/api/task-status/${taskId}`);
        if (response.ok) {
            const result = await response.json();
            alert(JSON.stringify(result.data, null, 2));
        }
    } catch (error) {
        alert('获取任务详情失败: ' + error.message);
    }
}

function clearHistory() {
    if (confirm('确定要清空所有历史记录吗？')) {
        taskHistory = [];
        localStorage.removeItem('kling_task_history');
        loadTaskHistory();
    }
}

async function searchTask() {
    const searchInput = document.getElementById('searchTaskId');
    const resultDiv = document.getElementById('searchResult');
    
    if (!searchInput || !resultDiv) return;
    
    const taskId = searchInput.value.trim();
    if (!taskId) {
        alert('请输入任务ID');
        return;
    }
    
    try {
        const response = await fetch(`${API_BASE_URL}/api/task-status/${taskId}`);
        const result = await response.json();
        
        if (response.ok && result.code === 0) {
            resultDiv.innerHTML = `
                <div class="search-result-success">
                    <h4>✅ 任务查询成功</h4>
                    <p><strong>任务ID:</strong> ${result.data.task_id}</p>
                    <p><strong>状态:</strong> ${getStatusText(result.data.task_status)}</p>
                    <p><strong>创建时间:</strong> ${new Date(result.data.created_at).toLocaleString()}</p>
                    ${result.data.task_status === 'succeed' ? 
                        `<button onclick="window.open('${result.data.task_result.videos[0].url}', '_blank')">查看视频</button>` : 
                        ''}
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="search-result-error">
                    <p>❌ 查询失败: ${result.message || '未知错误'}</p>
                </div>
            `;
        }
    } catch (error) {
        resultDiv.innerHTML = `
            <div class="search-result-error">
                <p>❌ 网络错误: ${error.message}</p>
            </div>
        `;
    }
}

function stopCurrentTask() {
    if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
        showMessage('已停止监控当前任务', 'info');
    }
}

            throw new Error('视频生成请求失败');
        }
        
        const videoResult = await videoResponse.json();
        
        console.log('[GENERATE] 生成响应:', videoResult);
        
        if (!videoResult.success) {
            throw new Error(videoResult.error || '视频生成失败');
        }
        
        // 3. 启动监控
        const taskId = videoResult.task_id;
        if (taskId) {
            // 添加到当前任务
            currentTask = {
                task_id: taskId,
                prompt: prompt,
                image_info: {
                    filename: fileInput.files[0].name,
                    size: fileInput.files[0].size
                },
                status: 'submitted',
                created_at: Date.now(),
                updated_at: Date.now()
            };
            
            localStorage.setItem('kling_current_task', JSON.stringify(currentTask));
            
            // 添加到历史记录
            addTaskToHistory(currentTask);
            
            // 更新UI显示
            updateTaskStatusInUI('submitted');
            
            // 开始轮询
            updateProgress(70, '视频生成任务已提交，等待处理...');
            startPollingTaskStatus(taskId);
            
            showMessage(`✅ 任务已提交，任务ID: ${taskId}`, 'success');

            const sidebar = document.getElementById('monitorSidebar');
            if (sidebar && !sidebar.classList.contains('active')) {
                sidebar.classList.add('active');
            }
            
        } else {
            throw new Error('未收到任务ID');
        }
        
    } catch (error) {
        console.error('[GENERATE] 生成视频失败:', error);
        showMessage(`❌ 生成失败: ${error.message}`, 'error');
        
        // 重置界面
        document.getElementById('generateBtn').disabled = false;
        document.getElementById('progressContainer').style.display = 'none';
    }
}

            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = text;
        }
        
        // 开始轮询任务状态
        function startPollingTaskStatus() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
            
            let attempts = 0;
            const maxAttempts = 60; // 最大尝试60次（5分钟）
            
            pollingInterval = setInterval(async () => {
                attempts++;
                if (attempts > maxAttempts) {
                    clearInterval(pollingInterval);
                    showMessage('视频生成超时，请稍后重试', 'error');
                    document.getElementById('generateBtn').disabled = false;
                    return;
                }
                
                try {
                    updateProgress(70 + (attempts * 0.5), `等待视频生成中... (${attempts}/60)`);
                    
                    const response = await fetch(`${API_BASE_URL}/api/task-status/${currentTaskId}`);
                    
                    if (!response.ok) {
                        throw new Error('查询任务状态失败');
                    }
                    
                    const result = await response.json();
                    
                    if (result.code === 0) {
                        const taskStatus = result.data.task_status;
                        
                        if (taskStatus === 'succeed') {
                            // 任务成功
                            clearInterval(pollingInterval);
                            handleSuccess(result);
                        } else if (taskStatus === 'failed') {
                            // 任务失败
                            clearInterval(pollingInterval);
                            handleFailure(result.data.task_status_msg || '视频生成失败');
                        }
                        // 如果状态是 processing，继续轮询
                    }
                    
                } catch (error) {
                    console.error('轮询失败:', error);
                }
            }, 5000); // 每5秒查询一次
        }
        
        // 处理成功结果
        function handleSuccess(result) {
            updateProgress(100, '视频生成完成！');
            
            const videos = result.data.task_result?.videos || [];
            if (videos.length > 0) {
                const videoUrl = videos[0].url;

                document.getElementById('downloadLink').href = videoUrl;
                document.getElementById('videoResult').style.display = 'block';
                
                // 隐藏进度条

                    document.getElementById('progressContainer').style.display = 'none';
                    document.getElementById('generateBtn').disabled = false;
                }, 1000);
                
                showMessage('视频生成成功！', 'success');
            }
        }
        
        // 处理失败结果
        function handleFailure(errorMsg) {
            showMessage(`视频生成失败: ${errorMsg}`, 'error');
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('progressContainer').style.display = 'none';
        }
