<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI图片生成 - AI创作平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="noise-overlay"></div>
    
    <!-- 导航栏 -->
    <nav class="topbar">
      <a class="topbar__brand" href="index.html">
        <span class="logo-heart" aria-hidden="true"></span>
        <span>AI创作平台</span>
      </a>
      <div class="topbar__links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="voice-clone.html" class="nav-link">音频克隆</a>
        <a href="image-gen.html" class="nav-link active">图片生成</a>
        <a href="image-to-video.html" class="nav-link">图生视频</a>
        <a href="digital-human.html" class="nav-link">数字人生成</a>
      </div>
      <button class="topbar__cta" id="settings-btn">设置</button>
    </nav>

    <!-- 主容器 -->
    <main class="main-container">
      <!-- 图片生成模块 -->
      <section id="image-gen" class="feature-section active">
        <div class="section-header">
          <h1 class="section-title">
            <span class="title-icon">🎨</span>
            AI图片生成
          </h1>
          <p class="section-subtitle">使用先进的AI技术，从文字描述生成精美图片</p>
        </div>

        <div class="content-grid">
          <!-- 左侧：输入区域 -->
          <div class="input-panel">
            <div class="panel-card">
              <h3>图片描述</h3>
              <textarea 
                id="image-prompt" 
                class="prompt-input" 
                placeholder="描述您想要生成的图片，例如：一只可爱的猫咪坐在窗台上，阳光洒在它的身上，背景是美丽的花园..."
                rows="6"
              ></textarea>
              
              <div style="margin-top: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">负面提示词（可选）</label>
                <textarea 
                  id="image-negative-prompt" 
                  class="prompt-input" 
                  placeholder="描述您不希望在图片中出现的内容，例如：lowres, bad anatomy, bad hands, text, error, missing fingers..."
                  rows="3"
                ></textarea>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">
                  用于排除不想要的元素，提高生成质量
                </p>
              </div>
              
              <div class="options-group">
                <div class="option-row">
                  <label>图片风格</label>
                  <select id="image-style" class="select-input">
                    <option value="realistic">写实风格</option>
                    <option value="anime">动漫风格</option>
                    <option value="oil-painting">油画风格</option>
                    <option value="watercolor">水彩风格</option>
                    <option value="sketch">素描风格</option>
                    <option value="cyberpunk">赛博朋克</option>
                    <option value="fantasy">奇幻风格</option>
                  </select>
                </div>

                <div class="option-row">
                  <label>LoRA 模型</label>
                  <select id="lora-select" class="select-input">
                    <option value="">不使用 LoRA</option>
                  </select>
                </div>

                <div class="option-row">
                  <label>LoRA 权重</label>
                  <input 
                    type="number" 
                    id="lora-weight" 
                    class="number-input" 
                    min="0" 
                    max="2" 
                    step="0.05" 
                    value="0.8"
                  />
                </div>

                <div class="option-row">
                  <label>图片尺寸</label>
                  <select id="image-size" class="select-input">
                    <option value="512x512">512×512 (正方形)</option>
                    <option value="768x512">768×512 (横向)</option>
                    <option value="512x768">512×768 (竖向)</option>
                    <option value="1024x1024" selected>1024×1024 (高清)</option>
                  </select>
                </div>

                <div class="option-row">
                  <label>生成数量</label>
                  <input 
                    type="number" 
                    id="image-count" 
                    class="number-input" 
                    min="1" 
                    max="4" 
                    value="1"
                  />
                </div>

                <div class="option-row">
                  <label>采样步数 (Sampling Steps)</label>
                  <input 
                    type="number" 
                    id="image-steps" 
                    class="number-input" 
                    min="1" 
                    max="150" 
                    value="20"
                  />
                  <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">
                    步数越多，质量越好，但生成时间越长（建议：20-50）
                  </p>
                </div>
              </div>

              <button id="generate-image-btn" class="primary-btn">
                <span class="btn-icon">✨</span>
                生成图片
              </button>
            </div>

            <!-- 历史记录 -->
            <div class="panel-card history-card">
              <h3>生成历史</h3>
              <div id="image-history" class="history-list">
                <p class="empty-state">暂无生成记录</p>
              </div>
            </div>
          </div>

          <!-- 右侧：预览区域 -->
          <div class="output-panel">
            <div class="panel-card output-card">
              <div class="output-header">
                <h3>生成结果</h3>
                <div class="output-actions">
                  <button id="clear-image-btn" class="icon-btn" title="清空">🗑️</button>
                  <button id="download-all-btn" class="icon-btn" title="全部下载">⬇️</button>
                </div>
              </div>
              
              <div id="image-output" class="output-content">
                <div class="empty-preview">
                  <div class="preview-icon">🖼️</div>
                  <p>生成的图片将显示在这里</p>
                </div>
              </div>

              <div id="image-loading" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>AI正在生成图片，请稍候...</p>
                <div class="progress-bar">
                  <div class="progress-fill"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 设置对话框 -->
    <dialog id="settings-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="modal-close" id="close-settings">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label>Stable Diffusion WebUI API 地址</label>
            <input type="text" id="api-url" class="text-input" placeholder="http://192.168.1.100:7860">
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">
              填入运行 WebUI 的设备 IP 地址和端口（默认 7860）
            </p>
          </div>
          <div class="setting-group">
            <label>默认质量</label>
            <select id="default-quality" class="select-input">
              <option value="standard">标准</option>
              <option value="high">高清</option>
              <option value="ultra">超高清</option>
            </select>
          </div>
          <div class="setting-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="deepseek-api-key" class="text-input" placeholder="sk-...">
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">
              用于 AI 助手功能，获取 API Key 请访问 <a href="https://platform.deepseek.com/api_keys" target="_blank" style="color: var(--accent-color);">DeepSeek 平台</a>
            </p>
          </div>
          <div class="setting-group">
            <label>可灵 (Kling) API 配置</label>
            <input type="text" id="kling-access-key" class="text-input" placeholder="请输入访问密钥 (Access Key)" style="margin-bottom: 0.5rem;">
            <input type="password" id="kling-secret-key" class="text-input" placeholder="请输入密钥 (Secret Key)">
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">
              用于图生视频功能，获取 API 密钥请访问 <a href="https://app.klingai.com/cn/" target="_blank" style="color: var(--accent-color);">可灵 AI 平台</a>
            </p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="secondary-btn" id="cancel-settings">取消</button>
          <button class="primary-btn" id="save-settings">保存</button>
        </div>
      </div>
    </dialog>

    <script src="script.js?v=20251223-12"></script>
  </body>
</html>
